[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-drought-forecasting"
version = "1.0.0"
description = "Paper-aligned ConvLSTM drought-forecasting research code"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
data = ["xarray>=2024.1", "h5netcdf>=1.3", "netCDF4>=1.6", "earthaccess>=0.8"]
figures = ["matplotlib>=3.8", "cartopy>=0.22", "pillow>=10"]
ml = ["tensorflow>=2.16,<2.21"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
test = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
